<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneByte — Internet, on your business</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff', 100: '#e0effe', 200: '#b9dffd', 300: '#7cc5fc',
              400: '#36a7f8', 500: '#0c8ce9', 600: '#006fc7', 700: '#0159a1',
              800: '#064b85', 900: '#0b3f6e',
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; margin: 0; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-white text-slate-900">
  <div id="root"></div>
  <script type="text/babel" src="./app.jsx"></script>
  <script type="text/babel">
    // Fallback if app.jsx not loaded
    if (typeof App === 'undefined') {
      function App() {
        return (
          <div className="min-h-screen flex items-center justify-center p-8">
            <div className="text-center max-w-lg">
              <div className="w-12 h-12 rounded-xl bg-brand-600 text-white font-bold text-lg flex items-center justify-center mx-auto mb-4">1B</div>
              <h1 className="text-3xl font-semibold tracking-tight">OneByte</h1>
              <p className="mt-3 text-slate-600">Internet, on your business.</p>
              <p className="mt-6 text-sm text-slate-500">Interactive prototype — open <code className="bg-slate-100 px-1 rounded">index.html</code> from this repo in your browser for the full experience (marketing site, dashboard, users, billing, developer & white-label).</p>
              <a href="https://github.com/laoluonifade/onebyte" className="inline-block mt-6 text-brand-600 font-medium text-sm hover:underline">github.com/laoluonifade/onebyte</a>
            </div>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    }
  </script>
</body>
</html>
